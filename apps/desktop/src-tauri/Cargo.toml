[package]
name = "gita"
version = "0.1.1"
edition = "2021"
description = "Gita nöbet çizelgesi"
license = "MIT"

[lib]
name = "gita_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rfd = "0.15"
